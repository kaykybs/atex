<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Money Dashboard</title>
    <link rel="stylesheet" href="pagina_modulos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container-app">
        <header class="barra-superior">
            <div class="logo">
                <h1><strong>Smart Money:</strong> Domine seu Dinheiro</h1>
            </div>
            <div class="acoes-cabecalho">
                <button class="botao-reserva">
                    <div class="icone-circulo"><i class="fa-solid fa-dollar-sign"></i></div>
                    Calculadora de Reserva
                </button>
                <div class="avatar-perfil">
                    <img src="https://ui-avatars.com/api/?name=User&background=2c3e50&color=fff" alt="Avatar do usuário">
                </div>
            </div>
        </header>

        <main class="layout-principal">
            <aside class="barra-lateral">
                <nav>
                    <ul>
                        <li class="ativo">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>Aulas</span>
                        </li>

                        <li>
                            <i class="fa-solid fa-expand"></i>
                            <span>Materias das aulas</span>
                        </li>
                        
                    </ul>
                </nav>
            </aside>

            <section class="area-conteudo">
                <h2 class="titulo-secao">Cocursco eu Fineoios</h2>
                
                <div class="container-cartoes">
                    <div class="cartao cartao-verde">
                        <div class="cabecalho-cartao">
                            <span class="unidade">UNIDADE 1:</span>
                            <h3>Diagnóstico Financeiro</h3>
                        </div>
                        
                        <div class="container-progresso">
                            <div class="anel-progresso">
                                <div class="interior-progresso">
                                    <i class="fa-solid fa-star"></i>
                                    <span class="porcentagem">75%</span>
                                    <span class="status">Concluidó</span>
                                </div>
                            </div>
                        </div>

                        <div class="pontos-paginacao">
                            <span class="ponto"></span>
                            <span class="ponto"></span>
                            <span class="ponto"></span>
                            <span class="ponto"></span>
                            <span class="ponto"></span>
                        </div>
                    </div>

                    <div class="cartao cartao-petroleo">
                        <div class="cabecalho-cartao">
                            <span class="unidade">UNIDADE 2:</span>
                            <h3>O Orcçamento Inteligente</h3>
                            
                            <div class="espacador"></div>
                            
                            <span class="unidade">UNIDADE 3:</span>
                            <h3>Seguraza e Futuro</h3>
                        </div>

                        <div class="icone-cadeado">
                            <i class="fa-solid fa-lock"></i>
                        </div>

                        <div class="pontos-paginacao">
