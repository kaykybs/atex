<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Curso - Unidade 1</title>
    <link rel="stylesheet" href="pagina_aulas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container-principal">
        
        <div class="secao-video">
            <video controls>
            <source src="./gestao-financeira.mp4" type="video/mp4">
            </video>
        </div>

        <div class="secao-lateral">
            <h2 class="titulo-unidade">UNIDADE 1: Diagnóstico Financeiro</h2>
            
            <ul class="lista-atividades">
                <li class="item-atividade">
                    <span class="texto-atividade">Video: Como ter gestão financeira?</span>
                </li>
                
                <a href="./Apostila_Educacao_Financeira_Premium.pdf" download="Apostila_Educacao_Financeira.pdf" style="text-decoration: none;">
                    <li class="item-atividade">
                        <span class="texto-atividade">Apostila: módulo 1</span>
                    </li>
                </a>   
            </ul>

            <div class="bloco-notas-container">
                <label class="titulo-bloco">Bloco de Notas</label>
                <div class="area-texto-bloco">
                    <textarea placeholder="Digite suas anotações aqui..."></textarea>
                    <i class="fa-solid fa-pen icone-editar"></i>
                </div>
            </div>

            <button class="botao-voltar">Voltar</button>
        </div>

    </div>

</body>
</html>
